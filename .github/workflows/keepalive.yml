name: 5. Keepalive

# Keeps the scheduled "4. Build Loop" workflow alive, and raises an alarm if
# builds go stale.
#
# Once a week, a few hours ahead of the Sunday build, it:
#   1. Re-enables the build workflow (and itself) through the GitHub API,
#      reporting whether GitHub had actually switched either one off.
#   2. Force-pushes a one-commit "keepalive" branch, which registers real
#      repository activity and resets GitHub's 60-day inactivity clock.
#   3. Checks how long ago "4. Build Loop" last succeeded and FAILS this job
#      if that is older than MAX_BUILD_AGE_DAYS. A failing job emails you,
#      which turns a silently-missed monthly build into a visible alarm.
#
# Design notes:
#   - No third-party Actions are used. Every step is plain shell running the
#     `gh` and `git` binaries that GitHub preinstalls on its own runners, so
#     there is no external code in this workflow to trust or audit.
#   - It uses only the automatic, per-run GITHUB_TOKEN, which GitHub issues at
#     the start of the job, scopes to this repository, and revokes when the job
#     ends. It never reads GH_PAT or any other secret.
#   - The keepalive branch is owned entirely by this workflow and is replaced
#     on every run. It never touches main, so it cannot interfere with the
#     Sunday sync against LoopKit upstream.
#   - Timing matters more than frequency. "4. Build Loop" only cares whether it
#     is enabled at Sunday 07:33 UTC, so this runs a few hours earlier the same
#     morning. That shrinks the window in which a disable could cost a build
#     from several days to about three hours, without running any more often.
#     The margin is deliberately generous because GitHub can delay scheduled
#     workflows under load.
#   - The freshness check runs LAST on purpose. If it fails, the re-enable and
#     activity steps have already done their work for the week.
#   - Threshold defaults to 40 days: the scheduled build runs monthly, and
#     TestFlight builds expire at 90, so 40 flags a missed build while leaving
#     roughly seven weeks to fix it. Override by creating a repository
#     variable named MAX_BUILD_AGE_DAYS.

on:
  workflow_dispatch:
  schedule:
    # Sundays at 04:17 UTC, about 3h15m before "4. Build Loop" at 07:33 UTC.
    - cron: "17 4 * * 0"

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Keep scheduled builds alive
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in build_loop.yml keepalive.yml; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}" \
                      --jq '.state' 2>/dev/null || echo "unknown")

            if gh api --silent -X PUT \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"; then
              if [ "$state" = "active" ]; then
                echo "${wf}: already active, enable call refreshed it"
              else
                echo "::warning::${wf} was in state '${state}' and has been re-enabled."
                echo "- \`${wf}\` had been switched off (state \`${state}\`) and was re-enabled." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning::Could not re-enable ${wf}. Check it manually on the Actions tab."
            fi
          done

      - name: Record repository activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir marker && cd marker
          git init -q -b keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          printf 'Automated activity marker for the scheduled Loop build.\nLast run: %s\n' "$STAMP" > README.md
          git add README.md
          git commit -qm "Keepalive ${STAMP}"
          git push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/keepalive
          echo "Pushed activity marker at ${STAMP}"

      - name: Check build freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ vars.MAX_BUILD_AGE_DAYS || '40' }}
        run: |
          LAST=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build_loop.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST" ]; then
            echo "::error::No successful '4. Build Loop' run found at all. Open the Actions tab and investigate."
            echo "### :rotating_light: No successful build on record" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "Last successful build: ${LAST} (${AGE_DAYS} days ago). Threshold: ${MAX_AGE_DAYS} days."

          if [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "### :rotating_light: Loop builds have gone stale" >> "$GITHUB_STEP_SUMMARY"
            echo "Last successful build was **${AGE_DAYS} days ago** (${LAST}), past the ${MAX_AGE_DAYS}-day threshold." >> "$GITHUB_STEP_SUMMARY"
            echo "TestFlight builds expire 90 days after upload. Check '4. Build Loop' for failures, and check that the Apple Developer Program agreements are signed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Last successful Loop build was ${AGE_DAYS} days ago, past the ${MAX_AGE_DAYS}-day threshold. TestFlight expires at 90 days, so investigate now."
            exit 1
          fi

          echo "### :white_check_mark: Keepalive ran" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled workflows re-enabled, repository activity recorded." >> "$GITHUB_STEP_SUMMARY"
          echo "Last successful build was ${AGE_DAYS} day(s) ago, within the ${MAX_AGE_DAYS}-day threshold." >> "$GITHUB_STEP_SUMMARY"
