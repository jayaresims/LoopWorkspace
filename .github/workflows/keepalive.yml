name: 5. Keepalive

# Keeps the scheduled "4. Build Loop" workflow from being switched off by
# GitHub's 60-day repository-inactivity rule.
#
# It does two independent things every Wednesday:
#   1. Calls the GitHub API to re-enable the build workflow (and itself).
#   2. Force-pushes a one-commit "keepalive" branch, which registers real
#      repository activity and resets the inactivity clock.
#
# Design notes:
#   - No third-party Actions are used. Every step is plain shell running the
#     `gh` and `git` binaries that GitHub preinstalls on its own runners, so
#     there is no external code in this workflow to trust or audit.
#   - It uses only the automatic, per-run GITHUB_TOKEN, which GitHub issues at
#     the start of the job, scopes to this repository, and revokes when the job
#     ends. It never reads GH_PAT or any other secret.
#   - The keepalive branch is owned entirely by this workflow and is replaced
#     on every run. It never touches main, so it cannot interfere with the
#     Sunday sync against LoopKit upstream.

on:
  workflow_dispatch:
  schedule:
    # Wednesdays at 06:17 UTC, deliberately away from the Sunday build.
    - cron: "17 6 * * 3"

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Keep scheduled builds alive
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in build_loop.yml keepalive.yml; do
            if gh api --silent -X PUT \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"; then
              echo "Re-enabled ${wf}"
            else
              echo "::warning::Could not re-enable ${wf}. Check it manually on the Actions tab."
            fi
          done

      - name: Record repository activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir marker && cd marker
          git init -q -b keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          printf 'Automated activity marker for the scheduled Loop build.\nLast run: %s\n' "$STAMP" > README.md
          git add README.md
          git commit -qm "Keepalive ${STAMP}"
          git push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/keepalive
          echo "Pushed activity marker at ${STAMP}"

      - name: Summary
        run: |
          echo "### Keepalive ran" >> $GITHUB_STEP_SUMMARY
          echo "The scheduled build workflow was re-enabled and repository activity was recorded." >> $GITHUB_STEP_SUMMARY
